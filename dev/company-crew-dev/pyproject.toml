[project]
name = "company-crew-devkit"
version = "0.2.0"
description = "Developer SDK and CLI for independently building, testing, packaging and deploying CrewAI Crew packages"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai>=1.15.17,<1.16",
  "crewai-tools[mcp]>=1.15.17,<1.16",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "mcp>=1.28,<2",
  "pandas>=3.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
crew-dev = "company_crew_devkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_crew_devkit", "src/company_crew_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
