services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: [ "uvicorn", "company_flow_server.app:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2" ]
    env_file: [ .env ]
    environment: &runtime-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CREW_REGISTRY_ROOT: /data/team_registry
      FLOW_ROOT: /app/flows
    ports: [ "8080:8080" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./crew_registry:/data/team_registry
      - ./flows:/app/flows
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  mcp:
    build: .
    command: [ "company-mcp" ]
    env_file: [ .env ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CREW_REGISTRY_ROOT: /data/team_registry
      FLOW_ROOT: /app/flows
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8090
    ports: [ "8090:8090" ]
    volumes:
      - ./crew_registry:/data/team_registry
      - ./flows:/app/flows
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: [ "celery", "-A", "company_flow_server.distributed.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-4}" ]
    env_file: [ .env ]
    environment: *runtime-env
    volumes:
      - ./crew_registry:/data/team_registry
      - ./flows:/app/flows
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    build: .
    command: [ "python", "-m", "company_flow_server.distributed.scheduler" ]
    env_file: [ .env ]
    environment: *runtime-env
    volumes:
      - ./crew_registry:/data/team_registry
      - ./flows:/app/flows
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  flower:
    build: .
    command: [ "celery", "-A", "company_flow_server.distributed.celery_app:celery_app", "flower", "--port=5555" ]
    env_file: [ .env ]
    environment: *runtime-env
    ports: [ "5555:5555" ]
    depends_on: [ redis ]

volumes:
  postgres_data:
  redis_data:
  crew_registry:
