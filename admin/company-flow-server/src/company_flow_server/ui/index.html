<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Agent Platform</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.top{height:62px;background:#111827;color:white;display:flex;align-items:center;padding:0 22px;gap:30px}.brand{font-weight:800}.tabs button{height:62px;border:0;background:none;color:#9ca3af;font-weight:700;cursor:pointer}.tabs .active{color:white;border-bottom:3px solid white}.view{display:none}.view.active{display:block}
.designer{display:grid;grid-template-columns:270px 1fr 330px;height:calc(100vh - 62px)}aside{background:white;padding:15px;overflow:auto}.palette{border-right:1px solid #ddd}.props{border-left:1px solid #ddd}.workspace{overflow:auto;padding:14px}.toolbar{display:flex;gap:7px;align-items:center;margin-bottom:10px}.btn{border:0;border-radius:7px;padding:8px 11px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.status{font-size:12px;color:#6b7280}
.card{padding:11px;border:1px solid #ddd;border-radius:9px;margin:8px 0;background:#fff;cursor:grab}.card:hover{border-color:#2563eb}.name{font-weight:700}.meta,.hint{font-size:11px;color:#6b7280}.canvas{position:relative;min-width:900px;min-height:650px;border:1px solid #d1d5db;border-radius:12px;background-color:#fff;background-image:radial-gradient(#d1d5db 1px,transparent 1px);background-size:20px 20px;overflow:hidden}
.node{position:absolute;width:230px;background:#fff;border:2px solid #2563eb;border-radius:12px;padding:11px;box-shadow:0 4px 14px #0002;cursor:move;z-index:2}.node.selected{outline:3px solid #93c5fd}.portrow{display:flex;justify-content:space-between;margin-top:9px;font-size:10px}.ports{max-height:90px;overflow:auto}.port{padding:2px 5px;margin:2px 0;border-radius:5px;background:#f3f4f6}.out{color:#047857}.in{color:#7c3aed}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.edge{stroke:#64748b;stroke-width:2;fill:none}.edge.good{stroke:#059669}.edge.bad{stroke:#dc2626;stroke-dasharray:5}.edgeLabel{font-size:10px;fill:#475569}
input,textarea,select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:7px;margin:4px 0 9px}textarea{min-height:75px}.schema{font:10px ui-monospace,monospace;background:#f3f4f6;padding:7px;border-radius:6px;white-space:pre-wrap}.rec{padding:8px;border:1px solid #d1fae5;background:#ecfdf5;border-radius:7px;margin:6px 0;font-size:11px}.rec button{float:right}.issue{padding:6px;border-radius:6px;margin:4px 0;font-size:11px}.error{background:#fee2e2}.warning{background:#fef3c7}
.simple{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 62px)}.simple main{padding:20px;overflow:auto}.empty{text-align:center;color:#6b7280;padding:90px}
.crewDiagram{position:relative;min-width:900px;min-height:580px;border:1px solid #d1d5db;border-radius:14px;background-color:#fff;background-image:radial-gradient(#d1d5db 1px,transparent 1px);background-size:20px 20px;overflow:auto;margin-top:14px}.crewSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.crewNodes{position:absolute;inset:0;z-index:2}.crewNodeD{position:absolute;width:210px;min-height:74px;background:#fff;border:2px solid #d1d5db;border-radius:12px;padding:11px;box-shadow:0 4px 12px #0001;cursor:pointer}.crewNodeD.task{border-color:#6366f1}.crewNodeD.agent{border-color:#059669}.crewNodeD.tool{border-color:#d97706}.crewNodeD.active{outline:3px solid #bfdbfe}.crewNodeD .kind{font-size:10px;font-weight:800;text-transform:uppercase;color:#6b7280;margin-bottom:4px}.crewEdge{fill:none;stroke:#94a3b8;stroke-width:2}.crewEdge.next{stroke:#6366f1;stroke-width:3}.crewEdge.uses{stroke:#d97706}.crewEdge.assigned{stroke:#059669}.crewEdgeLabel{font-size:10px;fill:#64748b}.crewLegend{display:flex;gap:14px;font-size:11px;color:#6b7280;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.crewInfo{margin-top:12px}.crewInfo pre{max-height:220px;overflow:auto}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff;margin:12px 0}.panel h3{margin-top:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.run{border:1px solid #e5e7eb;border-radius:8px;padding:9px;margin:6px 0;cursor:pointer}.ok{color:#047857}.failed{color:#b91c1c}.queued,.running{color:#b45309}.wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:99}.modal.open{display:grid}.modalBox{background:white;width:min(850px,90vw);max-height:85vh;overflow:auto;padding:20px;border-radius:14px}.verbose{background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:380px;overflow:auto;font:11px ui-monospace,monospace}
.historyList aside{min-width:340px;max-width:340px;border-right:1px solid #e5e7eb}.historyList main{flex:1;padding:20px;overflow:auto}
.runItem{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}.runItem:hover{background:#f8f9fb}.runItem.selected{background:#eff6ff;border-left:3px solid #2563eb}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge.succeeded{background:#d1fae5;color:#065f46}.badge.failed{background:#fee2e2;color:#991b1b}.badge.running{background:#fef3c7;color:#92400e;animation:pulse 1.5s ease-in-out infinite}.badge.queued{background:#e5e7eb;color:#374151}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.liveTag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#059669;margin-left:10px}.liveTag::before{content:'';width:8px;height:8px;border-radius:50%;background:#059669;animation:pulse 1s ease-in-out infinite}
.runMeta{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px;color:#6b7280}.runMeta span{display:flex;align-items:center;gap:4px}
.verboseLive{background:#111827;color:#e5e7eb;padding:14px;border-radius:10px;white-space:pre-wrap;max-height:480px;overflow:auto;font:11px/1.6 ui-monospace,monospace;scroll-behavior:smooth}
.historyLink{display:inline-flex;align-items:center;gap:5px;color:#2563eb;cursor:pointer;font-weight:600;font-size:13px;margin-top:6px}.historyLink:hover{text-decoration:underline}</style></head><body>
<header class="top"><div class="brand">Company Agent Platform</div><div class="tabs"><button id="tCrew" class="active" onclick="tab('crew')">Crew Process</button><button id="tHistory" onclick="tab('history')">Execution History</button><button id="tFlow" onclick="tab('flow')">Node Flow Designer</button><button id="tMcp" onclick="tab('mcp')">MCP Catalog</button><button onclick="window.open('/docs','_blank')">Swagger API</button></div></header>
<section id="crew" class="view active"><div class="simple"><aside><h2>Crew Management</h2><div id="crewList"></div></aside><main><div id="crewDetail" class="empty">Crew를 선택하세요.</div></main></div></section>
<section id="flow" class="view"><div class="designer">
<aside class="palette"><h2>Crew Catalog</h2><p class="hint">Canvas로 Drag & Drop 하세요.</p><div id="palette"></div></aside>
<div class="workspace"><div class="toolbar"><button class="btn primary" onclick="newFlow()">New</button><button class="btn secondary" onclick="autoLayout()">Auto Layout</button><button class="btn secondary" onclick="validateFlow()">Validate</button><button class="btn primary" onclick="saveFlow()">Save</button><select id="saved" style="width:190px;margin:0" onchange="loadFlow(this.value)"><option value="">Saved flows…</option></select><span id="status" class="status"></span></div><div id="canvas" class="canvas" ondragover="event.preventDefault()" ondrop="dropCrew(event)"><svg id="edges" class="edges"></svg><div id="nodes"></div></div></div>
<aside class="props"><h2>Flow</h2><input id="fid" value="my-flow" placeholder="Flow ID"><input id="fname" value="My Flow" placeholder="Name"><input id="fver" value="1.0.0" placeholder="Version"><textarea id="fdesc" placeholder="Description"></textarea><hr><div id="stepProps"><p class="hint">노드를 선택하세요.</p></div><hr><h3>Validation</h3><div id="issues" class="hint">아직 검증하지 않았습니다.</div></aside>
</div></section>
<section id="mcp" class="view"><div class="simple"><aside><h2>MCP Tools</h2><div id="mcpList"></div></aside><main><div id="mcpDetail" class="empty">MCP Tool을 선택하면 Input / Output Schema를 표시합니다.</div></main></div></section>
<section id="history" class="view"><div class="simple historyList"><aside><h2>Execution History</h2><div style="padding:0 4px 8px"><button class="btn secondary" onclick="loadHistory()" style="width:100%">↻ Refresh</button></div><div id="historyRunList"></div></aside><main><div id="historyDetail" class="empty">실행 이력을 선택하세요.</div></main></div></section>
<script>
let crews=[],steps=[],selected=-1,dragIndex=null,historyPollTimer=null,currentRunId=null;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KST=s=>{if(!s)return'-';try{let d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch(e){return s}};
const TAB_MAP={crew:'tCrew',history:'tHistory',flow:'tFlow',mcp:'tMcp'};
function tab(x){stopHistoryPoll();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(v=>v.classList.remove('active'));document.getElementById(x).classList.add('active');let btn=TAB_MAP[x];if(btn)document.getElementById(btn).classList.add('active');if(x==='history')loadHistory()}
async function init(){crews=(await (await fetch('/api/v1/crews')).json()).crews;renderCatalog();renderCrewList();renderMcp();refreshFlows();render()}
function renderCatalog(){palette.innerHTML=crews.map((c,i)=>`<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('crew','${i}')"><div class=name>${E(c.name)}</div><div class=meta>${E(c.crew_id)} @ ${E(c.version)}</div><div class=meta>IN ${Object.keys(c.input_schema?.properties||{}).length} · OUT ${Object.keys(c.output_schema?.properties||{}).length}</div></div>`).join('')}
function renderCrewList(){crewList.innerHTML=crews.map((c,i)=>`<div class=card onclick="showCrew(${i})"><b>${E(c.name)}</b><div class=meta>${E(c.crew_id)} @ ${E(c.version)}</div><div class=meta>${E(c.owner||'')} · ${KST(c.deployed_at)}</div></div>`).join('')}
async function showCrew(i){let c=crews[i],g=await (await fetch(`/api/v1/crews/${encodeURIComponent(c.crew_id)}/${c.version}/graph`)).json(),cfg=c.admin||{};crewDetail.className='';crewDetail.innerHTML=`<h2>${E(c.name)}</h2><div class=meta>${E(c.crew_id)} @ ${E(c.version)} · deployed ${KST(c.deployed_at)}</div><div class=actions style="margin-top:10px"><button class="btn primary" onclick="kickoff(${i})">▶ Kickoff</button><button class="btn danger" onclick="deleteCrew(${i})">Delete Crew</button></div><div class=adminGrid><div class=panel><h3>Schedule (Cron)</h3><label><input id=schEnabled type=checkbox style="width:auto" ${cfg.schedule?.enabled?'checked':''}> Enabled</label><input id=schCron value="${E(cfg.schedule?.cron||'')}" placeholder="*/5 * * * *"><button class="btn secondary" onclick="saveSettings(${i})">Save Schedule</button><p class=hint>관리자 상태로 별도 저장되므로 Crew 재배포 시 보존됩니다.</p></div><div class=panel><h3>Metadata</h3><label>Owner</label><input id=metaOwner value="${E(c.owner||'')}"><label>Deployment date override</label><input id=metaDate value="${E(c.deployed_at||'')}"><button class="btn secondary" onclick="saveSettings(${i})">Save Metadata</button></div><div class="panel wide"><h3>Initial Input Parameters</h3><textarea id=defaultInputs>${E(JSON.stringify(cfg.default_inputs||{},null,2))}</textarea><button class="btn secondary" onclick="saveSettings(${i})">Save Defaults</button></div><div class="panel wide"><h3>Task · Agent · Tool Process</h3><div class=crewLegend><span><i class=dot style="background:#6366f1"></i>Task</span><span><i class=dot style="background:#059669"></i>Agent</span><span><i class=dot style="background:#d97706"></i>Tool</span></div><div id=crewDiagram class=crewDiagram><svg id=crewSvg class=crewSvg></svg><div id=crewNodes class=crewNodes></div></div><div id=crewInfo class=crewInfo><pre class=schema>노드를 클릭하면 상세 설정을 표시합니다.</pre></div></div><div class="panel wide"><h3>Execution History</h3><div class=historyLink onclick="tab('history')">📋 Execution History 탭에서 전체 이력 보기 →</div></div></div>`;renderCrewDiagram(g)}
async function saveSettings(i){let c=crews[i],inputs;try{inputs=JSON.parse(defaultInputs.value||'{}')}catch(e){alert('Input JSON 오류');return}let body={schedule:{enabled:schEnabled.checked,cron:schCron.value.trim()},default_inputs:inputs,metadata:{owner:metaOwner.value.trim(),deployed_at:metaDate.value.trim()}};let r=await fetch(`/api/v1/crews/${encodeURIComponent(c.crew_id)}/settings`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert(await r.text());return}alert('저장되었습니다.');await init();showCrew(crews.findIndex(x=>x.crew_id===c.crew_id&&x.version===c.version))}
async function kickoff(i){let c=crews[i];if(!confirm(`${c.crew_id}@${c.version} 을(를) 실행합니다. 저장된 Default Input으로 Kickoff합니다.`))return;let r=await fetch(`/api/v1/crews/${encodeURIComponent(c.crew_id)}/${c.version}/kickoff`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inputs:{}})});let d=await r.json();if(r.ok){alert('Queued: '+d.run_id);tab('history')}else{alert(JSON.stringify(d))}}
async function deleteCrew(i){let c=crews[i];if(!confirm(`경고: ${c.crew_id}@${c.version} 배포본을 삭제합니다. Flow에서 참조 중이면 실행이 실패할 수 있습니다. 계속합니까?`))return;let r=await fetch(`/api/v1/crews/${encodeURIComponent(c.crew_id)}/${c.version}?confirm=true`,{method:'DELETE'});if(!r.ok){alert(await r.text());return}await init();crewDetail.className='empty';crewDetail.textContent='Crew가 삭제되었습니다.'}
async function loadHistory(){let r=await fetch('/api/v1/runs'),d=await r.json();let runs=d.runs||[];historyRunList.innerHTML=runs.length?runs.map(r=>`<div class="runItem${currentRunId===r.run_id?' selected':''}" onclick="selectRun('${E(r.run_id)}')"><span class="badge ${E(r.status)}">${E(r.status)}</span> <span style="font-weight:600">${E(r.crew_id)}</span><div class=meta>${E(r.trigger)} · ${KST(r.created_at)}</div><div class=meta style="font-size:10px;color:#9ca3af">${E(r.run_id)}</div></div>`).join(''):'<div class=empty style="padding:40px">실행 이력이 없습니다.</div>';if(currentRunId)selectRun(currentRunId)}
function stopHistoryPoll(){if(historyPollTimer){clearInterval(historyPollTimer);historyPollTimer=null}}
async function selectRun(id){stopHistoryPoll();currentRunId=id;document.querySelectorAll('.runItem').forEach(el=>{el.classList.toggle('selected',el.onclick.toString().includes(id))});let r=await fetch('/api/v1/runs/'+id);if(!r.ok){historyDetail.innerHTML='<div class=empty>실행 이력을 찾을 수 없습니다.</div>';return}let d=await r.json();renderRunDetail(d);let isLive=d.status==='running'||d.status==='queued';if(isLive){historyPollTimer=setInterval(async()=>{let pr=await fetch('/api/v1/runs/'+id);if(!pr.ok){stopHistoryPoll();return}let pd=await pr.json();renderRunDetail(pd);if(pd.status!=='running'&&pd.status!=='queued'){stopHistoryPoll();loadHistory()}},3000)}}
function renderRunDetail(d){let isLive=d.status==='running'||d.status==='queued';historyDetail.className='';historyDetail.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Run Detail</h2><span class="badge ${E(d.status)}">${E(d.status)}</span>${isLive?'<span class=liveTag>Live</span>':''}<div style="margin-left:auto"><button class="btn danger" onclick="deleteRunHistory('${E(d.run_id)}')">Delete</button></div></div><div class=runMeta><span>📦 ${E(d.crew_id)} @ ${E(d.version)}</span><span>🔀 ${E(d.trigger)}</span><span>📅 ${KST(d.created_at)}</span>${d.started_at?`<span>▶ ${KST(d.started_at)}</span>`:''}${d.ended_at?`<span>⏹ ${KST(d.ended_at)}</span>`:''}</div><div class=meta style="margin-bottom:12px;font-size:10px;color:#9ca3af">${E(d.run_id)}</div><div class=adminGrid><div class=panel><h3>Inputs</h3><pre class=schema>${E(JSON.stringify(d.inputs,null,2))}</pre></div><div class=panel><h3>Outputs</h3><pre class=schema>${E(JSON.stringify(d.outputs,null,2))}</pre></div></div>${d.error?`<div class=panel><h3 style="color:#991b1b">Error</h3><pre class=verbose>${E(d.error)}</pre></div>`:''}<div class=panel><h3>Verbose Log${isLive?' <span class=liveTag>Streaming</span>':''}</h3><pre id=verboseBox class=verboseLive>${E((d.verbose||[]).join('\n'))}</pre></div>`;let vb=document.getElementById('verboseBox');if(vb&&isLive)vb.scrollTop=vb.scrollHeight}
async function deleteRunHistory(id){if(!confirm('경고: 이 실행 이력을 영구 삭제합니다. 계속합니까?'))return;let r=await fetch(`/api/v1/runs/${id}?confirm=true`,{method:'DELETE'});if(!r.ok){alert(await r.text());return}stopHistoryPoll();currentRunId=null;historyDetail.className='empty';historyDetail.textContent='삭제되었습니다.';loadHistory()}
async function showRun(id){tab('history');setTimeout(()=>selectRun(id),100)}
async function deleteRun(id){await deleteRunHistory(id)}
function renderMcp(){fetch('/api/v1/mcp/tools').then(r=>r.json()).then(d=>{window.mcpTools=d.tools;mcpList.innerHTML=d.tools.map((t,i)=>`<div class=card onclick="showMcp(${i})"><b>${E(t.name)}</b><div class=meta>${E(t.description)}</div></div>`).join('')})}
function showMcp(i){let t=window.mcpTools[i];mcpDetail.className='';mcpDetail.innerHTML=`<h2>${E(t.name)}</h2><p>${E(t.description)}</p><div class=adminGrid><div class=panel><h3>Input Schema</h3><pre class=schema>${E(JSON.stringify(t.input_schema,null,2))}</pre></div><div class=panel><h3>Output Schema</h3><pre class=schema>${E(JSON.stringify(t.output_schema,null,2))}</pre></div></div>`}
function renderCrewDiagram(g){let ns=g.nodes||[],es=g.edges||[],pos={},taskIds=ns.filter(n=>n.type==='task').map(n=>n.id),taskOrder=[];let incoming=new Set(es.filter(e=>e.label==='next').map(e=>e.target));let roots=taskIds.filter(id=>!incoming.has(id));function walk(id){if(taskOrder.includes(id))return;taskOrder.push(id);es.filter(e=>e.source===id&&e.label==='next').forEach(e=>walk(e.target))}roots.forEach(walk);taskIds.forEach(walk);let taskIndex=Object.fromEntries(taskOrder.map((id,i)=>[id,i]));ns.filter(n=>n.type==='task').forEach(n=>{let row=taskIndex[n.id]??0;pos[n.id]={x:70,y:55+row*180}});ns.filter(n=>n.type==='agent').forEach((n,j)=>{let refs=es.filter(e=>e.target===n.id&&e.label==='assigned');let row=refs.length?(taskIndex[refs[0].source]??j):j;pos[n.id]={x:350,y:55+row*180}});let toolRows={};ns.filter(n=>n.type==='tool').forEach((n,j)=>{let refs=es.filter(e=>e.target===n.id&&e.label==='uses');let agent=refs[0]?.source;let assigned=es.find(e=>e.target===agent&&e.label==='assigned');let row=assigned?(taskIndex[assigned.source]??j):j;let offset=toolRows[row]||0;toolRows[row]=offset+1;pos[n.id]={x:650,y:55+row*180+offset*90}});let maxY=Math.max(580,...Object.values(pos).map(p=>p.y+130));crewDiagram.style.height=maxY+'px';crewNodes.innerHTML=ns.map(n=>{let p=pos[n.id]||{x:50,y:50};return `<div class="crewNodeD ${E(n.type)}" style="left:${p.x}px;top:${p.y}px" onclick='showCrewNode(${JSON.stringify(JSON.stringify(n))},this)'><div class=kind>${E(n.type)}</div><b>${E(n.label)}</b><div class=meta>${E(n.id.split(':').slice(1).join(':'))}</div></div>`}).join('');let w=crewDiagram.clientWidth||1000,h=maxY;crewSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);crewSvg.innerHTML=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>`+es.map(e=>{let a=pos[e.source],b=pos[e.target];if(!a||!b)return'';let x1=a.x+210,y1=a.y+37,x2=b.x,y2=b.y+37;if(e.label==='next'){x1=a.x+105;y1=a.y+74;x2=b.x+105;y2=b.y}let mx=(x1+x2)/2,my=(y1+y2)/2;return `<path class="crewEdge ${E(e.label)}" marker-end="url(#arrow)" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/><text class=crewEdgeLabel x="${mx+4}" y="${my-4}">${E(e.label)}</text>`}).join('');if(g.warning)crewInfo.innerHTML=`<div class="issue warning">${E(g.warning)}</div>`}
function showCrewNode(raw,el){document.querySelectorAll('.crewNodeD').forEach(x=>x.classList.remove('active'));el.classList.add('active');let n=JSON.parse(raw);crewInfo.innerHTML=`<h3>${E(n.label)}</h3><div class=meta>${E(n.type)} · ${E(n.id)}</div><pre class=schema>${E(JSON.stringify(n.detail||{},null,2))}</pre>`}
function dropCrew(e){e.preventDefault();let i=Number(e.dataTransfer.getData('crew'));if(Number.isNaN(i))return;let rect=canvas.getBoundingClientRect();addCrew(i,e.clientX-rect.left+canvas.scrollLeft,e.clientY-rect.top+canvas.scrollTop)}
function addCrew(i,x=60,y=60){let c=crews[i],base=c.crew_id.split('.').pop(),id=base,n=2;while(steps.some(s=>s.step_id===id))id=base+'-'+n++;steps.push({step_id:id,crew_id:c.crew_id,version:c.version,inputs:{},continue_on_error:false,x,y});selected=steps.length-1;render();props();if(steps.length>1)recommend(steps.length-2,steps.length-1)}
function render(){nodes.innerHTML=steps.map((s,i)=>{let c=getCrew(s),ins=c?.input_schema?.properties||{},outs=c?.output_schema?.properties||{};return `<div class="node ${i===selected?'selected':''}" style="left:${s.x}px;top:${s.y}px" data-i="${i}" onmousedown="startMove(event,${i})" onclick="selectNode(event,${i})"><b>${E(s.step_id)}</b><div class=meta>${E(s.crew_id)} @ ${E(s.version)}</div><div class=portrow><div class=ports>${Object.entries(ins).map(([k,v])=>`<div class="port in">◀ ${E(k)}:${E(v.type||'any')}</div>`).join('')}</div><div class=ports>${Object.entries(outs).map(([k,v])=>`<div class="port out">${E(k)}:${E(v.type||'any')} ▶</div>`).join('')}</div></div></div>`}).join('');drawEdges()}
function getCrew(s){return crews.find(c=>c.crew_id===s.crew_id&&c.version===s.version)}
function selectNode(e,i){e.stopPropagation();selected=i;render();props()}
function startMove(e,i){if(e.button!==0)return;dragIndex=i;let s=steps[i],sx=e.clientX,sy=e.clientY,ox=s.x,oy=s.y;function mv(ev){s.x=Math.max(0,ox+ev.clientX-sx);s.y=Math.max(0,oy+ev.clientY-sy);render()}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dragIndex=null}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)}
function drawEdges(){let svg=edges;svg.innerHTML='';steps.forEach((t,ti)=>Object.entries(t.inputs||{}).forEach(([field,val])=>{if(typeof val!=='string'||!val.startsWith('$steps.'))return;let p=val.split('.'),si=steps.findIndex(s=>s.step_id===p[1]);if(si<0)return;let a=steps[si],x1=a.x+230,y1=a.y+55,x2=t.x,y2=t.y+55,m=(x1+x2)/2;svg.innerHTML+=`<path class="edge good" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/><text class=edgeLabel x="${m}" y="${(y1+y2)/2-4}">${E(p.slice(3).join('.'))} → ${E(field)}</text>`}))}
function props(){if(selected<0){stepProps.innerHTML='<p class=hint>노드를 선택하세요.</p>';return}let s=steps[selected],c=getCrew(s);stepProps.innerHTML=`<h3>Step</h3><label>ID</label><input id=sid value="${E(s.step_id)}"><label>Input Mapping JSON</label><textarea id=imap>${E(JSON.stringify(s.inputs,null,2))}</textarea><button class="btn primary" onclick=applyProps()>Apply</button> <button class="btn danger" onclick=removeNode()>Remove</button><h3>Schema Recommendations</h3><div id=recs class=hint>다른 노드와 연결 추천을 계산할 수 있습니다.</div><button class="btn secondary" onclick=recommendBest()>Recommend from previous</button><h4>Input Schema</h4><pre class=schema>${E(JSON.stringify(c?.input_schema||{},null,2))}</pre><h4>Output Schema</h4><pre class=schema>${E(JSON.stringify(c?.output_schema||{},null,2))}</pre>`}
function applyProps(){try{steps[selected].step_id=sid.value.trim();steps[selected].inputs=JSON.parse(imap.value||'{}');render();props()}catch(e){alert(e.message)}}
function removeNode(){steps.splice(selected,1);selected=-1;render();props()}
async function recommend(si,ti){let a=steps[si],b=steps[ti],u=`/api/v1/schema/recommend?source_crew_id=${encodeURIComponent(a.crew_id)}&source_version=${encodeURIComponent(a.version)}&target_crew_id=${encodeURIComponent(b.crew_id)}&target_version=${encodeURIComponent(b.version)}`;let d=await (await fetch(u)).json();if(ti===selected)showRecs(si,d.recommendations);return d.recommendations}
async function recommendBest(){if(selected<=0){recs.textContent='이전 노드가 없습니다.';return}let all=[];for(let i=0;i<selected;i++){let r=await recommend(i,selected);r.forEach(x=>all.push({...x,sourceIndex:i}))}all.sort((a,b)=>b.score-a.score);showRecs(null,all)}
function showRecs(si,rs){let el=document.getElementById('recs');if(!el)return;el.innerHTML=rs.length?rs.map((r,k)=>`<div class=rec><b>${E(r.source_field)}</b> → <b>${E(r.target_field)}</b><br>${E(r.source_type)} → ${E(r.target_type)} · score ${r.score}<button class=btn onclick='applyRec(${si===null?(r.sourceIndex??selected-1):si},${JSON.stringify(r.source_field)},${JSON.stringify(r.target_field)})'>Connect</button><div style="clear:both"></div></div>`).join(''):'호환되는 필드가 없습니다.'}
function applyRec(si,sf,tf){let source=steps[si];steps[selected].inputs[tf]=`$steps.${source.step_id}.outputs.${sf}`;render();props();setTimeout(()=>recommendBest(),0)}
function autoLayout(){steps.forEach((s,i)=>{s.x=80+(i%3)*300;s.y=70+Math.floor(i/3)*190});render()}
function payload(){return {flow_id:fid.value.trim(),version:fver.value.trim(),name:fname.value.trim(),description:fdesc.value,steps:steps.map(({x,y,...s})=>s),output:{}}}
async function validateFlow(){let d=await (await fetch('/api/v1/flows/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())})).json();let arr=[...(d.errors||[]).map(x=>({level:'error',message:x})),...(d.schema_issues||[])];issues.innerHTML=arr.length?arr.map(x=>`<div class="issue ${x.level}">${E(x.step_id?x.step_id+': ':'')}${E(x.message)}</div>`).join(''):'<div class="rec">✓ Flow / Schema validation passed</div>';status.textContent=d.valid?'✓ Valid':'✕ Validation failed';return d.valid}
async function saveFlow(){if(!await validateFlow())return;let p=payload(),r=await fetch(`/api/v1/flows/${encodeURIComponent(p.flow_id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});status.textContent=r.ok?'✓ Saved':'Save failed';if(r.ok)refreshFlows()}
async function refreshFlows(){let d=await (await fetch('/api/v1/flows')).json();saved.innerHTML='<option value="">Saved flows…</option>'+d.flows.map(f=>`<option value="${E(f.flow_id)}">${E(f.name)} (${E(f.version)})</option>`).join('')}
async function loadFlow(id){if(!id)return;let g=await (await fetch(`/api/v1/flows/${encodeURIComponent(id)}`)).json();fid.value=g.flow_id;fname.value=g.name;fver.value=g.version;fdesc.value=g.description||'';steps=g.nodes.map((n,i)=>({step_id:n.id,crew_id:n.crew_id,version:n.version,inputs:n.inputs||{},continue_on_error:false,x:80+(i%3)*300,y:70+Math.floor(i/3)*190}));selected=-1;render();props()}
function newFlow(){steps=[];selected=-1;fid.value='my-flow';fname.value='My Flow';fver.value='1.0.0';fdesc.value='';render();props();issues.textContent='아직 검증하지 않았습니다.'}
init();
</script></body></html>
